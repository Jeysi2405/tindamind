<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TindaMind</title>
    
    <!-- Inter Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Link to static CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Fullscreen Main Container -->
    <div class="login-wrapper">
        <div class="login-floating-card">
            <h1 class="login-title">Mabuhay!</h1>

            <!-- Flask Flash Message Notifications -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="on">
                <!-- CSRF Token (Active when CSRF protection is configured) -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required>
                </div>

                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
                </div>

                <div class="remember-box" style="display: flex; align-items: center; margin-bottom: 15px; font-size: 0.85rem; color: #555;">
                    <input type="checkbox" id="remember" name="remember" style="margin-right: 8px;">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn-submit-login">LOGIN</button>

                <div class="forgot-link-box">
                    <a href="#">Forgot your password?</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
