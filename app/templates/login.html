<!DOCTYPE html>
<html lang="en" class="h-full bg-[#FFF5EE]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TindaMind</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="h-full flex flex-col justify-between p-8 antialiased text-gray-800 selection:bg-[#F2994A] selection:text-white">

  <!-- Top Left Branding Logo -->
  <header class="flex items-center gap-2.5">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="h-8 w-auto" onerror="this.style.display='none'">
    <i class="fa-solid fa-cash-register text-3xl text-gray-800"></i>
    <span class="text-3xl font-black text-[#F2994A] tracking-tight">TindaMind</span>
  </header>

  <!-- Main Content Container: Centered Layout -->
  <main class="flex-1 flex items-center justify-center py-6">
    <div class="w-full max-w-4xl flex flex-col md:flex-row items-center justify-center gap-8 md:gap-16 px-4">
      
      <!-- Left Illustration Vector (Perfectly Centered & Proportional) -->
      <div class="flex justify-center items-center shrink-0">
        <img src="{{ url_for('static', filename='store-illustration.png') }}" 
             alt="Sari-Sari Store Illustration" 
             class="w-full max-w-[300px] md:max-w-[340px] object-contain drop-shadow-sm">
      </div>

      <!-- Right Login Form Card -->
      <div class="w-full max-w-md shrink-0">
        <div class="bg-white rounded-[32px] p-8 md:p-10 shadow-xl border border-gray-100/80 space-y-6">
          
          <!-- Welcome Titles -->
          <div class="text-left space-y-1">
            <h1 class="text-4xl md:text-5xl font-extrabold text-[#F2994A] tracking-tight">Mabuhay!</h1>
            <p class="text-gray-400 font-medium text-sm md:text-base">Manage your store with ease.</p>
          </div>

          <!-- Flask Flash Message Notifications -->
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              <div class="space-y-2">
                {% for category, message in messages %}
                  <div class="px-4 py-2.5 rounded-2xl text-xs font-semibold border {% if category in ['danger', 'error'] %}bg-rose-50 border-rose-200 text-rose-600{% elif category == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-600{% else %}bg-amber-50 border-amber-200 text-amber-600{% endif %}">
                    {{ message }}
                  </div>
                {% endfor %}
              </div>
            {% endif %}
          {% endwith %}

          <!-- Login Form -->
          <form method="POST" action="{{ url_for('auth.login') }}" autocomplete="on" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

            <!-- Username Input -->
            <div class="relative flex items-center border-b-2 border-gray-400 focus-within:border-[#F2994A] pb-2 transition">
              <i class="fa-solid fa-user text-gray-800 text-lg w-7"></i>
              <input type="text" id="username" name="username" required placeholder="Username…" autocomplete="username"
                     class="w-full bg-transparent pl-2 text-gray-800 placeholder-gray-400 font-medium focus:outline-none text-sm md:text-base">
            </div>

            <!-- Password Input -->
            <div class="relative flex items-center border-b-2 border-gray-400 focus-within:border-[#F2994A] pb-2 transition">
              <i class="fa-solid fa-lock text-gray-800 text-lg w-7"></i>
              <input type="password" id="password" name="password" required placeholder="Password…" autocomplete="current-password"
                     class="w-full bg-transparent pl-2 text-gray-800 placeholder-gray-400 font-medium focus:outline-none text-sm md:text-base">
            </div>

            <div class="flex items-center justify-between text-xs text-gray-500">
              <label for="remember" class="inline-flex items-center gap-2 cursor-pointer font-medium">
                <input type="checkbox" id="remember" name="remember" class="rounded border-gray-300 text-[#F2994A] focus:ring-[#F2994A]">
                <span>Remember me</span>
              </label>
              <a href="#" onclick="alert('Please contact your store administrator to reset your password.'); return false;" class="font-semibold text-gray-400 hover:text-gray-600 transition">
                Forgot your password?
              </a>
            </div>

            <!-- Login Button -->
            <div class="pt-1">
              <button type="submit" class="w-full py-3.5 bg-[#F2994A] hover:bg-[#e0893b] active:scale-[0.99] text-white font-extrabold text-base tracking-wider rounded-2xl shadow-md transition">
                LOGIN
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </main>

  <!-- Empty Footer for flex alignment -->
  <div></div>

</body>
</html>
