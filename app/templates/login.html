<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TindaMind</title>
    
    <!-- Link to your static CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Logo at top-left of the page -->
    <div class="brand-header">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="TindaMind Logo" class="brand-logo-img">
        <span class="brand-name">TindaMind</span>
    </div>

    <!-- Fullscreen Main Container -->
    <div class="login-wrapper">
        
        <!-- Left Section: Store Illustration -->
        <div class="login-left-side">
            <div class="illustration-container">
                <img src="{{ url_for('static', filename='store-illustration.png') }}" alt="Sari-Sari Store" class="store-illustration-img">
            </div>
        </div>

        <!-- Right Section: Floating Login Card -->
        <div class="login-right-side">
            <div class="login-floating-card">
                <h1 class="login-title">Mabuhay!</h1>
                <p class="login-subtitle">Manage your store with ease.</p>

                <!-- Flask Flash Message Notifications -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="flash-messages">
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }}">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('core.login') }}" autocomplete="on">
                    <!-- CSRF Token (Active when CSRF protection is configured) -->
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

                    <div class="input-group">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" placeholder="Username" autocomplete="username" required>
                    </div>

                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn-submit-login">LOGIN</button>

                    <div class="forgot-link-box">
                        <a href="#">Forgot your password?</a>
                    </div>
                </form>
            </div>
        </div>

    </div>

</body>
</html>
