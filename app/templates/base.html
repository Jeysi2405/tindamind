<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}TindaMind - Sari-Sari Store Management{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            200: '#eaddd7',
                            300: '#e0cec7',
                            500: '#8c534a',
                            600: '#7b453e',
                            700: '#67362f',
                            800: '#542c26',
                            900: '#3d201c',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom CSS Overrides -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">

    {% block extra_head %}{% endblock %}
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased selection:bg-brand-500 selection:text-white">

    <!-- Mobile Navigation Drawer Backdrop -->
    <div id="mobile-sidebar-backdrop" class="fixed inset-0 z-40 bg-slate-900/50 backdrop-blur-sm hidden transition-opacity lg:hidden"></div>

    <div class="flex h-full w-full overflow-hidden">
        <!-- Responsive Sidebar Scaffolding -->
        {% include 'partials/_sidebar.html' ignore missing %}

        <!-- Main Content Area -->
        <div class="flex flex-1 flex-col overflow-y-auto min-w-0">
            <!-- Top Navbar Scaffolding -->
            {% include 'partials/_navbar.html' ignore missing %}

            <!-- System Flash Alerts -->
            <div id="alert-container" class="w-full px-4 pt-4 sm:px-6 lg:px-8">
                {% include 'partials/_alerts.html' ignore missing %}
            </div>

            <!-- Page Body Content Injection -->
            <main class="flex-1 px-4 py-6 sm:px-6 lg:px-8 max-w-7xl w-full mx-auto">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Core Client-side Scripts -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
